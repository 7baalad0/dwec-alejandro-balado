<body>

    <header>
    <p>Calculadora nota</p>
    </header>


    <main>
<form id="formulario">

    <label for="examen">Nota Examen:</label>
    <input type="number" id="examen" min="0" max="10" step="0.01">

    <label for="practica">Nota Practica:</label>
    <input type="number" id="practica" min="0" max="10" step="0.01">

    <button type="submit">Calcular</button>

    <p id="resultado"></p>

</form>
    </main>
